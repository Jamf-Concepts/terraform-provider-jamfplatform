name: Integration Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    name: Docs Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  unit:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go test -v -race -cover -count=1 ./...

  # Compute the minimal acceptance scope for this PR: the changed packages plus
  # everything that transitively depends on them (scripts/acctargets). Changed Go
  # files are attributed at declaration granularity, so purely ADDING to a hub
  # package (providerdata, testhelpers, internal/common/*) reaches only that
  # package, and a registration-only edit to the provider hub reaches only the
  # constructs whose constructors moved. A change to a global file (go.mod,
  # GNUmakefile, this workflow) still resolves to "./..." — the full suite.
  plan-acc:
    name: Plan Acceptance Scope
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so merge-base against the PR base branch resolves.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - id: scope
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          pkgs="$(go run -tags acctargets ./scripts/acctargets "$base")"
          echo "Acceptance scope: ${pkgs:-<none — no acceptance packages affected>}"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  # Run the (surgical) acceptance subset. Skipped entirely when the change set
  # affects no acceptance package.
  acceptance:
    name: Acceptance
    needs: plan-acc
    if: needs.plan-acc.outputs.packages != ''
    uses: ./.github/workflows/acceptance.yml
    with:
      packages: ${{ needs.plan-acc.outputs.packages }}
    secrets: inherit

  # The Jamf Account family runs in a job of its own because its precondition is
  # the inverse of every other family's: AccPreCheckAccount requires BOTH scope
  # variables unset (an organization-scoped integration sends no scope header),
  # while AccPreCheck requires at least one of them set. One env block cannot
  # satisfy both, so routing these packages through the job above skips every one
  # of them silently — and a suite that always skips still reports green.
  #
  # Shares the acceptance-tenant concurrency group declared in the reusable
  # workflow, so this job and the one above queue against each other rather than
  # hitting the estate at the same time.
  #
  # The packages are fixed rather than taken from plan-acc: the scope this job
  # runs under reaches only this family, so anything else in the computed set
  # would skip here and is already covered by the job above. plan-acc is still
  # what decides whether to run at all — either it named an account package, or
  # it fell back to the whole suite, which includes this family.
  acceptance-account:
    name: Acceptance (Jamf Account)
    needs: plan-acc
    if: needs.plan-acc.outputs.packages == './...' || contains(needs.plan-acc.outputs.packages, 'internal/resources/account/') || contains(needs.plan-acc.outputs.packages, 'internal/actions/account/')
    uses: ./.github/workflows/acceptance.yml
    with:
      packages: "./internal/resources/account/... ./internal/actions/account/..."
      organization_scope: true
    secrets: inherit
