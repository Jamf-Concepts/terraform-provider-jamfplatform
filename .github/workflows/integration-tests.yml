name: Integration Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    name: Docs Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  unit:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go test -v -race -cover -count=1 ./...

# The acceptance jobs that used to live here — plan-acc, acceptance and
# acceptance-account — are gone, and so is the reusable workflow they called.
# .github/workflows/acceptance.yml is now a standalone product-lane pipeline with
# its own pull_request, schedule and workflow_dispatch triggers, so it plans its
# own scope and needs no caller. Two things went with them:
#
#   - `acceptance-account`, the duplicate caller that existed only because
#     AccPreCheckAccount requires BOTH scope variables unset while AccPreCheck
#     requires at least one set, and one env block cannot satisfy both. The lane
#     matrix expresses that instead: the account lane IS the organization-scope
#     run, so the `organization_scope` input and both `*-account` jobs are
#     deleted.
#
#   - the `needs: unit` edge, which meant a PR that did not compile never
#     reached the estate. acceptance.yml carries its own
#     `go vet -tags acceptance ./...` guard in the plan job for the same effect,
#     because a cross-workflow dependency cannot exist for a workflow that also
#     runs on a schedule.
