name: Apple Schemas

# Keeps both embedded Apple schema tables current with apple/device-management:
# internal/common/appleprofiles/profiles.json (configuration profile payloads) and
# internal/common/appledeclarations/declarations.json (declarative device management declarations).
# The provider validates legacy payloads and declarations against them during plan.
#
# This is deliberately a scheduled job that opens a pull request, NOT a check on every pull request:
# a freshness check on the critical path would block unrelated work the day Apple publishes. It
# follows the pattern Dependabot already uses here for Go modules and actions — a scheduled,
# reviewable pull request — because a schema diff can turn a passing configuration into a failing
# one and so needs a human to look at it.
#
# Runs DAILY, which is more often than upstream moves, and deliberately so. An unrecognised key or
# declaration type is an **error** rather than a warning, because the platform silently discards
# one and the device never receives it — so while the table is stale the provider blocks a
# configuration that would work. Apple publishes keys on a seed branch around OS betas and Jamf
# offers them in its UI immediately, which is faster than this provider's release cadence; a daily
# refresh keeps that window to a day rather than a month. The job costs a sparse clone and a diff.

on:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A refresh must never race itself; a queued run picks up whatever the previous one committed.
concurrency:
  group: apple-schemas
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # apple-schemas discovers Apple's newest seed_OS_* branch and unions it with release. It fails
      # rather than falling back to release alone if discovery finds nothing, because a release-only
      # table would report every seed-only key as unknown — and that is an error, so it would block
      # working configurations. A failure here means Apple changed the branch naming convention.
      - name: Regenerate the schema tables
        run: make apple-schemas

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          tables="internal/common/appleprofiles/profiles.json internal/common/appledeclarations/declarations.json"
          if git diff --quiet -- $tables; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schema tables are already current."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Both tables are generated from one clone, so their provenance always agrees; report the
          # declaration table's, which names every branch unioned.
          table=internal/common/appledeclarations/declarations.json
          {
            echo "refs=$(jq -r '.refs | join(" + ")' "$table")"
            echo "release=$(jq -r .release "$table")"
            echo "commits=$(jq -r '.commits | to_entries | map("\(.key)@\(.value[0:12])") | join(", ")' "$table")"
            echo "declarations=$(jq -r '.declarations | length' "$table")"
            echo "payloads=$(jq -r '.payloads | length' internal/common/appleprofiles/profiles.json)"
          } >> "$GITHUB_OUTPUT"

      # A schema diff changes what the provider accepts, so the suites that consume the table must
      # still pass before a refresh is proposed.
      - name: Test against the new tables
        if: steps.diff.outputs.changed == 'true'
        run: |
          go test ./internal/common/appleprofiles/... \
                  ./internal/common/appledeclarations/... \
                  ./internal/resources/blueprints/...

      # A fixed branch is force-pushed, so an unreviewed run does not accumulate branches and an
      # already-open pull request picks up the newer tables instead of a second one being opened.
      - name: Open or update the refresh pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_COMMITS: ${{ steps.diff.outputs.commits }}
          UPSTREAM_RELEASE: ${{ steps.diff.outputs.release }}
          UPSTREAM_REFS: ${{ steps.diff.outputs.refs }}
          DECLARATION_COUNT: ${{ steps.diff.outputs.declarations }}
          PAYLOAD_COUNT: ${{ steps.diff.outputs.payloads }}
        run: |
          set -euo pipefail
          branch="chore/apple-schemas-refresh"

          cat > /tmp/commit-message <<EOF
          chore(appleschemas): refresh Apple schemas to ${UPSTREAM_RELEASE}

          Regenerated both embedded tables from apple/device-management
          (${UPSTREAM_COMMITS}).
          EOF

          cat > /tmp/pr-body <<EOF
          Apple published new schemas. This refreshes both embedded tables the provider validates against.

          - Upstream: \`${UPSTREAM_COMMITS}\` (\`${UPSTREAM_RELEASE}\`)
          - Branches unioned: \`${UPSTREAM_REFS}\`
          - Now carrying ${PAYLOAD_COUNT} payload types and ${DECLARATION_COUNT} declaration types

          **Review focus** — most of a refresh is newly added keys, which is harmless. What matters is anything that could fail a plan that works today, because these findings are errors rather than warnings:

          - a key whose \`type\` changed, or which gained \`required\`
          - a key whose \`enum\` lost a value, or whose \`min\`/\`max\` narrowed
          - a payload type or declaration type that disappeared upstream, which would start reporting as unrecognised
          - a change to \`statusItems\`, which would start reporting existing status subscriptions as unknown

          A key moving from the seed branch to release is expected and safe; watch instead for a key leaving the union entirely.

          Opened by the Apple Schemas workflow.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add internal/common/appleprofiles/profiles.json \
                  internal/common/appledeclarations/declarations.json
          git commit --file=/tmp/commit-message
          git push --force origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "An open refresh pull request already exists; it now carries the newer tables."
            exit 0
          fi
          gh pr create \
            --head "$branch" \
            --title "chore(appleschemas): refresh Apple schemas to ${UPSTREAM_RELEASE}" \
            --body-file /tmp/pr-body
