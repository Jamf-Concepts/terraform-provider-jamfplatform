name: Acceptance (reusable)

# Reusable acceptance-test runner. Callers pass the package set to test:
#   - "./..."            the full suite (scheduled run)
#   - "<imp> <imp> ..."  a surgical subset (PR run, scoped by scripts/acctargets)
#
# Both callers use `secrets: inherit`, so the tenant credentials and fixture
# secrets below resolve from the repo/org/environment secret stores without
# having to be re-declared per caller — there is deliberately no `secrets:`
# block to keep in step with the env list below.
#
# Callers also choose the API integration scope. The default is the shared
# tenant/environment integration every other family uses; `organization_scope:
# true` is the Jamf Account family, which needs its own caller job (see
# TESTING.md §Jamf Account).

on:
  workflow_call:
    inputs:
      packages:
        description: 'Space-separated package import paths, or "./..." for the full suite.'
        required: true
        type: string
      organization_scope:
        description: >-
          Run the suite under organization scope: send no scope header at all,
          which is what the jamfplatform_account_* family requires. Blanks both
          scope variables and authenticates with the Jamf Account integration's
          own credentials.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    # Serialise across ALL PRs, branches, and the scheduled run: the suite
    # mutates a single shared Jamf tenant, so only one acceptance run may
    # execute at a time. The group is a constant (NOT github.ref) so any second
    # run shares it and waits for the in-progress run instead of running
    # alongside it. cancel-in-progress: false never kills a running suite — the
    # newcomer queues until it finishes.
    concurrency:
      group: acceptance-tenant
      cancel-in-progress: false
    # No job timeout-minutes: serial (-p=1) tenant suites can exceed an hour;
    # rely on the GitHub default 6h job ceiling. Per-package limit is enforced
    # by `go test -timeout` below (matches `make testacc`).
    environment: acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.*"
          terraform_wrapper: false
      - run: go mod download
        # -p=1 keeps tenant-stateful suites serial. Every gated env var below is
        # sourced from a GitHub secret; when a secret is unset the value is empty
        # and the corresponding suite self-skips (t.Skip) rather than failing.
        # Source of truth: Getenv/LookupEnv sweep of internal/** (re-run before edits).
      - name: Acceptance tests
        id: acc
        run: |
          set -o pipefail
          echo "Scope: ${{ inputs.packages }}"
          go test -v -cover -count=1 -tags=acceptance -timeout=120m -p=1 ${{ inputs.packages }} 2>&1 | tee test-output.log
        env:
          TF_ACC: "1"

          # --- Core credentials (required; suites hard-skip without these) ---
          #
          # Under organization scope these come from a SEPARATE integration
          # rather than the shared one with its scope header dropped: a Jamf API
          # integration is created against exactly one scope, so an
          # organization-scoped run authenticates as its own client. Each scope
          # therefore resolves only its own secrets, with no cross-fallback — a
          # tenant credential aimed at /sso/v1 is refused 403 BAD_PERMISSIONS,
          # which would fail the suite instead of skipping it.
          #
          # The trailing `|| ''` on each is load-bearing: the unselected branch
          # evaluates to the boolean false, which would otherwise reach the
          # environment as the string "false" and read as a real value.
          JAMFPLATFORM_BASE_URL: ${{ (inputs.organization_scope && secrets.JAMFPLATFORM_ACCOUNT_BASE_URL) || (!inputs.organization_scope && secrets.JAMFPLATFORM_BASE_URL) || '' }}
          JAMFPLATFORM_CLIENT_ID: ${{ (inputs.organization_scope && secrets.JAMFPLATFORM_ACCOUNT_CLIENT_ID) || (!inputs.organization_scope && secrets.JAMFPLATFORM_CLIENT_ID) || '' }}
          JAMFPLATFORM_CLIENT_SECRET: ${{ (inputs.organization_scope && secrets.JAMFPLATFORM_ACCOUNT_CLIENT_SECRET) || (!inputs.organization_scope && secrets.JAMFPLATFORM_CLIENT_SECRET) || '' }}

          # Both blank under organization scope, which is the whole reason that
          # family needs a job of its own: a scope header of either kind makes
          # providerdata's gate refuse every jamfplatform_account_* construct at
          # Configure, so AccPreCheckAccount skips whenever it sees one set —
          # while AccPreCheck, which every other family routes through, skips
          # unless one of them is set. The two cannot hold in one env block.
          JAMFPLATFORM_ENVIRONMENT_ID: ${{ (!inputs.organization_scope && secrets.JAMFPLATFORM_ENVIRONMENT_ID) || '' }}
          JAMFPLATFORM_TENANT_ID: ${{ (!inputs.organization_scope && secrets.JAMFPLATFORM_TENANT_ID) || '' }}

          # --- Jamf Security Cloud scope declaration ---
          # Set EXACTLY ONE of these, matching whichever scope the run is
          # configured with: AccPreCheckSecurityCloud skips when both carry a
          # value, and skips when the one that is set does not equal the
          # corresponding JAMFPLATFORM_* value. Today only the tenant form has a
          # secret, so the environment form resolves empty and the pair is
          # unambiguous.
          #
          # Deliberately separate secrets rather than copies of the scope vars
          # above. Writing `${{ secrets.JAMFPLATFORM_TENANT_ID }}` here would
          # satisfy the equality check by construction and thereby assert a
          # Security Cloud entitlement nobody verified, turning a clean skip on a
          # Pro-only tenant into a suite of failures. Unset leaves every Security
          # Cloud suite skipping, which is a legitimate state, not a gap.
          JAMFPLATFORM_SECURITY_CLOUD_ENVIRONMENT_ID: ${{ secrets.JAMFPLATFORM_SECURITY_CLOUD_ENVIRONMENT_ID }}
          JAMFPLATFORM_SECURITY_CLOUD_TENANT_ID: ${{ secrets.JAMFPLATFORM_SECURITY_CLOUD_TENANT_ID }}

          # --- Jamf Account organization-scope declaration ---
          # AccPreCheckAccount requires this as the operator's declaration that
          # the credentials above really are organization-scoped. Nothing can be
          # compared against it — an organization-scoped request carries no scope
          # header, so no JAMFPLATFORM_* variable holds the organization — which
          # is exactly why it is declared: without it, a tenant credential set
          # with both scope variables blank looks identical to a real
          # organization integration.
          #
          # Add it together with the three JAMFPLATFORM_ACCOUNT_* credentials
          # above; declaring the scope without them just moves a skip to a
          # failure. Until a maintainer adds all four, the Jamf Account caller
          # job runs and self-skips, which is the honest state and a strict
          # improvement on the suite being unreachable.
          JAMFPLATFORM_ACCOUNT_ORGANIZATION_ID: ${{ secrets.JAMFPLATFORM_ACCOUNT_ORGANIZATION_ID }}

          # --- Jamf Account SSO domain fixtures (both optional; each covers a
          #     verification outcome the suite cannot manufacture) ---
          JAMFPLATFORM_ACC_SSO_VERIFIED_DOMAIN: ${{ secrets.JAMFPLATFORM_ACC_SSO_VERIFIED_DOMAIN }}
          JAMFPLATFORM_ACC_SSO_UNVERIFIABLE_DOMAIN: ${{ secrets.JAMFPLATFORM_ACC_SSO_UNVERIFIABLE_DOMAIN }}

          # --- Automated Device Enrollment ---
          JAMFPLATFORM_ADE_TOKEN: ${{ secrets.JAMFPLATFORM_ADE_TOKEN }}
          JAMFPLATFORM_ADE_SERIAL: ${{ secrets.JAMFPLATFORM_ADE_SERIAL }}
          JAMFPLATFORM_ADE_SERIAL2: ${{ secrets.JAMFPLATFORM_ADE_SERIAL2 }}
          JAMFPLATFORM_ADE_MOBILE_SERIAL: ${{ secrets.JAMFPLATFORM_ADE_MOBILE_SERIAL }}
          JAMFPLATFORM_ADE_MOBILE_SERIALS: ${{ secrets.JAMFPLATFORM_ADE_MOBILE_SERIALS }}

          # --- Acceptance fixtures (existing tenant objects referenced by tests) ---
          JAMFPLATFORM_ACC_COMPUTER_SERIAL: ${{ secrets.JAMFPLATFORM_ACC_COMPUTER_SERIAL }}
          JAMFPLATFORM_ACC_MOBILE_SERIAL: ${{ secrets.JAMFPLATFORM_ACC_MOBILE_SERIAL }}
          JAMFPLATFORM_ACC_MDPP_UUID_LOOKUP: ${{ secrets.JAMFPLATFORM_ACC_MDPP_UUID_LOOKUP }}

          # --- Real LDAP / cloud-IdP directory fixture (group-scoped & DS-group
          #     suites bootstrap a directory, then resolve a real group/user
          #     against it). Replaced the former *_CRITERIA_DS_GROUP* /
          #     *_ENROLLMENT_* / *_VPP_DS_GROUP fixtures. ---
          JAMFPLATFORM_ACC_LDAP_GROUP_NAME: ${{ secrets.JAMFPLATFORM_ACC_LDAP_GROUP_NAME }}
          JAMFPLATFORM_ACC_LDAP_USERNAME: ${{ secrets.JAMFPLATFORM_ACC_LDAP_USERNAME }}
          JAMFPLATFORM_ACC_LDAP_PASSWORD: ${{ secrets.JAMFPLATFORM_ACC_LDAP_PASSWORD }}

          # --- Secrets, tokens & PKCS#12 blobs (base64) ---
          JAMFPLATFORM_VPP_TOKEN: ${{ secrets.JAMFPLATFORM_VPP_TOKEN }}
          JAMFPLATFORM_ACC_SMTP_GOOGLE: ${{ secrets.JAMFPLATFORM_ACC_SMTP_GOOGLE }}
          JAMFPLATFORM_ACC_SELF_SERVICE_SAML: ${{ secrets.JAMFPLATFORM_ACC_SELF_SERVICE_SAML }}
          JAMFPLATFORM_ACC_SSO_IDP_URL: ${{ secrets.JAMFPLATFORM_ACC_SSO_IDP_URL }}
          JAMFPLATFORM_ACC_SSO_METADATA_BASE64: ${{ secrets.JAMFPLATFORM_ACC_SSO_METADATA_BASE64 }}
          JAMFPLATFORM_ACC_SUPERVISION_P12_BASE64: ${{ secrets.JAMFPLATFORM_ACC_SUPERVISION_P12_BASE64 }}
          JAMFPLATFORM_ACC_SUPERVISION_P12_PASSWORD: ${{ secrets.JAMFPLATFORM_ACC_SUPERVISION_P12_PASSWORD }}

          # --- GSX (Global Service Exchange) connection ---
          JAMFPLATFORM_ACC_GSX_KEYSTORE_BASE64: ${{ secrets.JAMFPLATFORM_ACC_GSX_KEYSTORE_BASE64 }}
          JAMFPLATFORM_ACC_GSX_KEYSTORE_PASSWORD: ${{ secrets.JAMFPLATFORM_ACC_GSX_KEYSTORE_PASSWORD }}
          JAMFPLATFORM_ACC_GSX_SERVICE_ACCOUNT: ${{ secrets.JAMFPLATFORM_ACC_GSX_SERVICE_ACCOUNT }}
          JAMFPLATFORM_ACC_GSX_SHIP_TO: ${{ secrets.JAMFPLATFORM_ACC_GSX_SHIP_TO }}
          JAMFPLATFORM_ACC_GSX_TOKEN: ${{ secrets.JAMFPLATFORM_ACC_GSX_TOKEN }}
          JAMFPLATFORM_ACC_GSX_USERNAME: ${{ secrets.JAMFPLATFORM_ACC_GSX_USERNAME }}

          # --- Google Cloud Identity Provider (Secure LDAP); the *_ROTATED pair is
          #     optional and only guards the wo_version cert-rotation regression ---
          JAMFPLATFORM_GOOGLE_DOMAIN_NAME: ${{ secrets.JAMFPLATFORM_GOOGLE_DOMAIN_NAME }}
          JAMFPLATFORM_GOOGLE_KEYSTORE_BASE64: ${{ secrets.JAMFPLATFORM_GOOGLE_KEYSTORE_BASE64 }}
          JAMFPLATFORM_GOOGLE_KEYSTORE_PASSWORD: ${{ secrets.JAMFPLATFORM_GOOGLE_KEYSTORE_PASSWORD }}
          JAMFPLATFORM_GOOGLE_KEYSTORE_BASE64_ROTATED: ${{ secrets.JAMFPLATFORM_GOOGLE_KEYSTORE_BASE64_ROTATED }}
          JAMFPLATFORM_GOOGLE_KEYSTORE_PASSWORD_ROTATED: ${{ secrets.JAMFPLATFORM_GOOGLE_KEYSTORE_PASSWORD_ROTATED }}

          # --- Jamf Protect (separate product credentials) ---
          JAMFPLATFORM_PROTECT_URL: ${{ secrets.JAMFPLATFORM_PROTECT_URL }}
          JAMFPLATFORM_PROTECT_CLIENT_ID: ${{ secrets.JAMFPLATFORM_PROTECT_CLIENT_ID }}
          JAMFPLATFORM_PROTECT_PASSWORD: ${{ secrets.JAMFPLATFORM_PROTECT_PASSWORD }}

          # --- Destructive opt-ins (tests that mutate/erase tenant state stay
          #     skipped unless explicitly enabled) ---
          JAMFPLATFORM_ACC_DESTRUCTIVE: ${{ secrets.JAMFPLATFORM_ACC_DESTRUCTIVE }}
          JAMFPLATFORM_ACC_CDP_DESTRUCTIVE: ${{ secrets.JAMFPLATFORM_ACC_CDP_DESTRUCTIVE }}

          # --- Tuning ---
          JAMFPLATFORM_MIN_REQUEST_INTERVAL_MS: ${{ secrets.JAMFPLATFORM_MIN_REQUEST_INTERVAL_MS }}

      # Surface which acceptance suites actually ran, failed, or self-skipped, so
      # an env-gated suite that never executes (missing secret) is visible
      # instead of vanishing into a green check, and a failure is nameable from
      # the summary without opening the raw log. Counts top-level TestAcc*
      # results only.
      - name: Gated suite summary
        if: always()
        run: |
          log=test-output.log
          {
            echo "## Acceptance suite summary"
            echo
            echo "**Scope:** \`${{ inputs.packages }}\`"
            echo
            if [ ! -s "$log" ]; then
              echo "_No test output captured (job failed before tests ran)._"
              exit 0
            fi
            pass=$(grep -cE '^--- PASS: TestAcc[^/]+\(' "$log" || true)
            fail=$(grep -cE '^--- FAIL: TestAcc[^/]+\(' "$log" || true)
            skip=$(grep -cE '^--- SKIP: TestAcc[^/]+\(' "$log" || true)
            echo "**Ran:** ${pass:-0} passed, ${fail:-0} failed · **Skipped:** ${skip:-0}"
            echo
            if [ "${fail:-0}" -gt 0 ]; then
              # Open by default: a failure is the one thing nobody should have
              # to click to see.
              echo "<details open><summary>Failed suites (${fail})</summary>"
              echo
              echo '```'
              grep -E '^--- FAIL: TestAcc[^/]+\(' "$log" | sed -E 's/^--- FAIL: //' | sort -u || true
              echo '```'
              echo
              echo "</details>"
              echo
            fi
            echo "<details><summary>Skipped suites (gate unset)</summary>"
            echo
            echo '```'
            grep -E '^--- SKIP: TestAcc[^/]+\(' "$log" | sed -E 's/^--- SKIP: //' | sort -u || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
